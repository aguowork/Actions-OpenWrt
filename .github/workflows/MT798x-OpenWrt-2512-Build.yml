#
# https://github.com/P3TERX/Actions-OpenWrt
# MT798x 系列路由器固件自动编译脚本
#
# 编译流程说明：
# 1. diy-part1.sh                    # 添加 feed 源
# 2. feeds update -a                 # 更新 feeds
# 3. feeds install -a                # 安装 feeds 包
# 4. 加载设备配置片段到 .config      # 25.12.4 源码不提供本工作流使用的 defconfig
# 5. diy-part2.sh                    # 添加或替换软件包
# 6. make defconfig                  # 合并配置，检查依赖
# 7. make download                   # 下载源码
# 8. make compile                    # 编译

name: MT798x OpenWrt (fanchmwrt-25.12.4)

# 触发工作流程的事件
on:
  repository_dispatch:  # 允许通过 API 触发工作流程
  workflow_dispatch:    # 允许手动触发工作流程
    inputs:
      device_selection:
        description: '选择要编译的设备'
        required: true
        type: choice
        options:
          - 全部
          - AX6000
          - WR30U
          - 360T7
        default: '全部'

# 环境变量设置
env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt.git  # 源码仓库地址
  REPO_BRANCH: fanchmwrt-25.12.4  # 源码分支
  VERSION: 25.12.4
  UPLOAD_BIN_DIR: false  # 是否上传整个 bin 目录
  UPLOAD_FIRMWARE: true  # 是否上传固件
  UPLOAD_RELEASE: true   # 是否发布 Release
  TZ: Asia/Shanghai     # 时区设置

permissions:
  contents: write       # 创建 Release 并上传固件资产

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用 Ubuntu 22.04 作为构建环境
    strategy:
      fail-fast: false
      matrix:
        device: ${{ github.event.inputs.device_selection == '全部' && fromJson('["AX6000", "WR30U", "360T7"]') || fromJson(format('[ "{0}" ]', github.event.inputs.device_selection)) }}

    steps:
    - name: 📝 记录工作流开始时间
      id: workflow_time
      run: |
        echo "start_time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
        echo "system_info=$(lsb_release -ds | tr -d '"')" >> $GITHUB_OUTPUT

    - name: 📥 检出代码仓库
      uses: actions/checkout@main

    - name: 🔧 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gettext-base gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 📦 克隆 OpenWrt 源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: ⚙️ 设置设备特定变量
      run: |
        CONFIG_BASE_PATH="./config/25.12/fanchmwrt"
        DIY_BASE_PATH="./diy/25.12/fanchmwrt"
        FILES_BASE_PATH="./files/25.12/fanchmwrt"
        echo "CONFIG_FILE=${CONFIG_BASE_PATH}/${{ matrix.device }}/${{ matrix.device }}.config" >> $GITHUB_ENV
        echo "DIY_P1_SH=${DIY_BASE_PATH}/${{ matrix.device }}/diy-part1.sh" >> $GITHUB_ENV
        echo "DIY_P2_SH=${DIY_BASE_PATH}/${{ matrix.device }}/diy-part2.sh" >> $GITHUB_ENV
        echo "FILES_BASE_PATH=${FILES_BASE_PATH}" >> $GITHUB_ENV

    - name: 🔌 加载自定义 feeds (diy-part1.sh)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 🔄 更新 feeds 源
      run: cd openwrt && ./scripts/feeds update -a

    - name: 📦 安装 feeds 软件包
      run: cd openwrt && ./scripts/feeds install -a

    - name: 📝 加载自定义配置
      env:
        DDNSTO_TOKEN: ${{ secrets.DDNSTO_TOKEN }}
        WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
        WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        WECHATPUSH_SC3KEY: ${{ secrets.WECHATPUSH_SC3KEY }}
        WECHATPUSH_SC3UID: ${{ secrets.WECHATPUSH_SC3UID }}
      run: |
        : "${DDNSTO_TOKEN:?Missing GitHub Secret DDNSTO_TOKEN}"
        : "${WXPUSHER_TOKEN:?Missing GitHub Secret WXPUSHER_TOKEN}"
        : "${WXPUSHER_UIDS:?Missing GitHub Secret WXPUSHER_UIDS}"
        : "${WECHATPUSH_SC3KEY:?Missing GitHub Secret WECHATPUSH_SC3KEY}"
        : "${WECHATPUSH_SC3UID:?Missing GitHub Secret WECHATPUSH_SC3UID}"

        if [[ ! "${WXPUSHER_TOKEN}" =~ ^AT_[A-Za-z0-9_-]+$ ]]; then
          echo "::error::GitHub Secret WXPUSHER_TOKEN 格式无效"
          exit 1
        fi
        if [[ ! "${WXPUSHER_UIDS}" =~ ^UID_[A-Za-z0-9_-]+$ ]]; then
          echo "::error::GitHub Secret WXPUSHER_UIDS 必须是单个 WxPusher UID"
          exit 1
        fi

        if [ -d "${FILES_BASE_PATH}" ]; then
          mkdir -p openwrt/files
          cp -rf "${FILES_BASE_PATH}"/. openwrt/files/
        fi

        # 私有固件：分别初始化监控脚本与网页项目的独立 WxPusher 配置。
        WXPUSHER_CONFIG_FILES=(
          "openwrt/files/etc/JiaoBen/wxpusher.conf"
          "openwrt/files/etc/wx/wx_settings.conf"
        )
        for WXPUSHER_CONFIG_FILE in "${WXPUSHER_CONFIG_FILES[@]}"; do
          if [ ! -f "${WXPUSHER_CONFIG_FILE}" ]; then
            echo "::error::找不到 ${WXPUSHER_CONFIG_FILE}"
            exit 1
          fi
          sed -i \
            -e 's/^WXPUSHER_ENABLED=.*/WXPUSHER_ENABLED=1/' \
            -e "s|^WX_APP_TOKEN=.*|WX_APP_TOKEN='${WXPUSHER_TOKEN}'|" \
            -e "s|^WX_MY_UID=.*|WX_MY_UID='${WXPUSHER_UIDS}'|" \
            "${WXPUSHER_CONFIG_FILE}"
          chmod 600 "${WXPUSHER_CONFIG_FILE}"
          if ! (
            . "${WXPUSHER_CONFIG_FILE}"
            [ "${WXPUSHER_ENABLED}" = "1" ] &&
              [ "${WX_APP_TOKEN}" = "${WXPUSHER_TOKEN}" ] &&
              [ "${WX_MY_UID}" = "${WXPUSHER_UIDS}" ]
          ); then
            echo "::error::WxPusher 配置写入失败：${WXPUSHER_CONFIG_FILE}"
            exit 1
          fi
        done
        echo "监控脚本与网页项目的 WxPusher 配置已安全写入"

        # ==================== 写入 ServerChan 3.0 配置 ====================
        WECHAT_CONFIG="openwrt/files/etc/config/wechatpush"
        if [ -f "$WECHAT_CONFIG" ]; then
          sed -i \
            -e "s|^	option sc3key .*|	option sc3key '${WECHATPUSH_SC3KEY}'|" \
            -e "s|^	option sc3uid .*|	option sc3uid '${WECHATPUSH_SC3UID}'|" \
            "$WECHAT_CONFIG"
          chmod 600 "$WECHAT_CONFIG"
          echo "wechatpush sc3key/sc3uid 已写入"
        else
          echo "::error::找不到 ${WECHAT_CONFIG}"
          exit 1
        fi

        cd openwrt
        # fanchmwrt-25.12.4 没有 defconfig，直接使用仓库中的设备配置片段。
        if [ ! -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          echo "::error::找不到设备配置文件 $GITHUB_WORKSPACE/$CONFIG_FILE"
          exit 1
        fi
        : > .config
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: ⬇️ 下载编译依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 🔨 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 💾 检查磁盘空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 📤 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_${{ matrix.device }}_bin_${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 📦 整理固件文件
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 🏷️ 生成发布标签
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        RELEASE_TAG="$(date +"%Y.%m.%d-%H%M-${VERSION}")-${{ matrix.device }}"
        echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

        # Release 正文保留构建信息和校验和；文件列表由 GitHub 的 Assets 区域提供。
        RELEASE_BODY="$GITHUB_WORKSPACE/release.txt"
        {
          echo "# OpenWrt ${VERSION} - ${{ matrix.device }}"
          echo
          echo "- 源码分支：${REPO_BRANCH}"
          echo "- 构建时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "- 设备：${{ matrix.device }}"
          echo
          echo "## SHA256"
          echo
          echo '```text'
          (
            cd "$FIRMWARE"
            while IFS= read -r -d '' FILE_NAME; do
              sha256sum -- "$FILE_NAME"
            done < <(find . -maxdepth 1 -type f -printf '%f\0' | sort -z)
          )
          echo '```'
        } > "$RELEASE_BODY"

        test -s "$RELEASE_BODY"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: ⬆️ 上传固件到 Artifacts
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_${{ matrix.device }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 🚀 发布固件到 Release
      uses: ncipollo/release-action@v1
      if: steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        artifacts: "${{ env.FIRMWARE }}/*"
        artifactErrorsFailBuild: true
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: "release.txt"
        allowUpdates: true
        replacesArtifacts: true

    - name: 🔗 获取固件下载链接
      id: firmware
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success' && !cancelled()
      run: |
        cd "${{ env.FIRMWARE }}"
        # 选择一个默认升级固件，并把其它 .bin 文件交给 Release 页面查看。
        FIRMWARE_PATH=$(find . -maxdepth 1 -type f -name '*-squashfs-sysupgrade.bin' -printf '%f\n' | sort | head -n 1)
        [ -n "$FIRMWARE_PATH" ] || FIRMWARE_PATH=$(find . -maxdepth 1 -type f -name '*-sysupgrade.bin' -printf '%f\n' | sort | head -n 1)
        [ -n "$FIRMWARE_PATH" ] || FIRMWARE_PATH=$(find . -maxdepth 1 -type f -name '*.bin' -printf '%f\n' | sort | head -n 1)
        if [ -n "$FIRMWARE_PATH" ]; then
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.release_tag }}/${FIRMWARE_PATH}" >> $GITHUB_OUTPUT
        fi
        echo "all_firmware_url=https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }}" >> $GITHUB_OUTPUT

    - name: 📧 发送编译完成通知
      if: always()
      run: |
        # 定义函数
        format_time() {
          local duration=$1
          local hours=$((duration / 3600))
          local minutes=$(((duration % 3600) / 60))
          echo "${hours}h${minutes}m"
        }

        generate_firmware_links() {
          local release_url="https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }}"
          local download_base="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.release_tag }}"
          local firmware_count=0

          if [ -d "${{ env.FIRMWARE }}" ]; then
            while IFS= read -r FIRMWARE_FILE; do
              [ -n "$FIRMWARE_FILE" ] || continue
              firmware_count=$((firmware_count + 1))
              echo "<li>📥 ${FIRMWARE_FILE}：<a href='${download_base}/${FIRMWARE_FILE}' target='_blank'>点击下载</a></li>"
            done < <(find "${{ env.FIRMWARE }}" -maxdepth 1 -type f -name '*.bin' -printf '%f\n' | sort)
          fi

          if [ "$firmware_count" -gt 0 ]; then
            echo "<li>📋 完整发布文件及校验和：<a href='${release_url}' target='_blank'>查看 Release</a></li>"
          else
            echo "<li>📥 升级固件：Release未发布</li>"
            echo "<li>📥 完整固件：Release未发布</li>"
          fi
        }

        escape_json() {
          echo "$1" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g'
        }

        # 计算编译时间
        START_TIME="${{ steps.workflow_time.outputs.start_time }}"
        END_TIME="$(date '+%Y-%m-%d %H:%M:%S')"
        DURATION=$(( $(date -d "$END_TIME" +%s) - $(date -d "$START_TIME" +%s) ))
        BUILD_DURATION=$(format_time $DURATION)

        # 设置编译状态
        if [ "${{ steps.compile.outputs.status }}" = "success" ] && [ "${{ steps.organize.outputs.status }}" = "success" ]; then
          BUILD_STATUS="✅"
          STATUS_MSG="编译完成于"
          FIRMWARE_LINE="$(generate_firmware_links)"
        else
          BUILD_STATUS="❌" 
          STATUS_MSG="编译失败于"
          FIRMWARE_LINE=""
        fi

        # 构建通知内容
        NOTIFICATION=$(cat << EOM
        <h2>🔄 OpenWrt 固件编译通知</h2>

        <h3>📋 编译环境信息：</h3>
        <ul>
          <li>运行环境: ${{ steps.workflow_time.outputs.system_info }}</li>
          <li>源码分支: ${REPO_BRANCH}</li>
          <li>源码仓库: $(basename ${REPO_URL} .git)</li>
          <li>开始时间: ${START_TIME}</li>
        </ul>

        <h3>${BUILD_STATUS} ${{ matrix.device }}</h3>
        <ul>
          <li>⏱️ ${STATUS_MSG}: ${END_TIME}</li>
          ${FIRMWARE_LINE}
          <li>⌛ 总耗时: ${BUILD_DURATION}</li>
        </ul>
        EOM
        )

        # 发送通知
        ESCAPED_NOTIFICATION=$(escape_json "${NOTIFICATION}")
        JSON_DATA="{
          \"appToken\": \"${{ secrets.WXPUSHER_TOKEN }}\",
          \"content\": \"${ESCAPED_NOTIFICATION}\",
          \"summary\": \"OpenWrt-${{ matrix.device }} 固件编译已完成\",
          \"contentType\": 2,
          \"uids\": [\"${{ secrets.WXPUSHER_UIDS }}\"]
        }"

        # 发送通知（仅当配置了 secrets 时）
        if [ -n "${{ secrets.WXPUSHER_TOKEN }}" ] && [ -n "${{ secrets.WXPUSHER_UIDS }}" ]; then
          if PUSH_RESPONSE=$(curl -fsS --connect-timeout 10 --max-time 20 \
              -X POST -H "Content-Type: application/json" \
              -d "${JSON_DATA}" \
              https://wxpusher.zjiecode.com/api/send/message); then
            if echo "${PUSH_RESPONSE}" | jq -e '.code == 1000 and .success == true' >/dev/null; then
              echo "编译完成通知发送成功"
            else
              PUSH_MESSAGE=$(echo "${PUSH_RESPONSE}" | jq -r '.msg // "未知业务错误"' 2>/dev/null || true)
              echo "::warning::通知发送失败：${PUSH_MESSAGE}"
            fi
          else
            echo "::warning::通知接口连接失败，但不影响工作流"
          fi
        else
          echo "未配置 WXPUSHER secrets，跳过通知发送"
        fi

    - name: 🗑️ 清理旧的工作流运行记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: 🗑️ 清理旧的 Release 发布
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        mapfile -t older_releases < <(
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'add | map(select(.draft == false)) | sort_by(.published_at) | reverse | .[3:][] | [.tag_name] | @tsv'
        )

        for release in "${older_releases[@]}"; do
          [ -n "$release" ] || continue
          echo "删除旧 Release：$release"
          gh release delete "$release" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
        done
